name = "token-samurai-refresh-scheduler"
main = "src/index.ts"
compatibility_date = "2026-09-28"

# Fires every 5 minutes. This is the only external clock for both scheduled
# routes now: Vercel Hobby cannot run its own cron more often than once a
# day, so /api/cron/refresh and /api/cron/geckoterminal are both invoked from
# here. The refresh route's own due-check (REFRESH_POLICY/isProviderDue) decides
# whether a tick does anything; GeckoTerminal is paced here instead: 7 one-token
# ?slice=1 calls per tick, 6.5 s apart. See src/index.ts and
# docs/geckoterminal-integration.md.
[triggers]
crons = ["*/5 * * * *"]

# CRON_SECRET must equal the Vercel deployment's own CRON_SECRET so
# isAuthorizedRefreshRequest() accepts it. It is a secret, not a var: set it
# with `wrangler secret put CRON_SECRET` (or the Cloudflare dashboard), and
# never commit it here.
# REFRESH_URL is the Vercel production BASE URL, not a complete route URL —
# the Worker appends /api/cron/refresh and /api/cron/geckoterminal to it
# itself (see src/index.ts). It is a plain (non-secret) var.
#
# COINGECKO_API_KEY (for the /coingecko-proxy route — see src/index.ts) is a secret, not
# a var: set it with `wrangler secret put COINGECKO_API_KEY` (or the Cloudflare dashboard),
# never here. It only needs to be the same key already configured as COINGECKO_API_KEY on
# the Vercel deployment; this Worker never receives that env's value, it holds its own copy.
[vars]
REFRESH_URL = "https://tokensam.vercel.app"
COINGECKO_API_PLAN = "demo"

# Enabled via the dashboard while diagnosing the /coingecko-proxy CoinGecko 403 (needed to
# see this Worker's own console.error output, e.g. the CF-Ray diagnostic in src/index.ts).
# Declared here so it survives future deploys instead of being silently reset by Wrangler,
# which overwrites dashboard-only settings not present in this file.
[observability.logs]
enabled = true
invocation_logs = true
persist = true
